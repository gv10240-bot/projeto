name: build-dxvk-diag
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build glslang-tools gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 gcc-mingw-w64-i686 g++-mingw-w64-i686
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix
          sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix

      - name: Baixar DXVK 1.10.3 e aplicar o patch
        run: |
          git clone --depth 1 --branch v1.10.3 https://github.com/doitsujin/dxvk.git dxvk
          cd dxvk
          patch -p1 < ../dxvk-diag.patch

      - name: Compilar
        run: |
          mkdir -p out
          cd dxvk
          ./package-release.sh 1.10.3-diag ../out --no-package

      - uses: actions/upload-artifact@v4
        with:
          name: dxvk-1.10.3-diag
          path: out/dxvk-1.10.3-diag
